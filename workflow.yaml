# ============================================================
# 量化代码自我反思流 (Quant Code Self-Reflection Flow)
# 4-Node Linear DAG: spec -> generator -> critic -> refiner
# ============================================================
name: 量化代码自我反思流
version: "1.9.1"

# ---------- 运行时 ----------
# builtin: 用 WorkBuddy 内置模型（子代理驱动，不消耗自有 API 额度）—— 默认
# api:     直连 provider，可无人值守，但需要自备 key 和余额
runtime: builtin

# ---------- 内置模型档位（runtime=builtin 的唯一来源）----------
# profile: 合法值 lite / reasoning / default
#   lite      -> 平台快速模型（deepseek-v4.1-flash 档）
#   reasoning -> 平台推理模型（deepseek-v4-pro 档）
#
# lock: true  -> 全部节点强制共用 profile，节点/模型上任何 agent_profile 声明
#                都视为配置冲突，校验阶段直接拒绝启动（不是静默忽略）
# lock: false -> 允许节点用 agent_profile 逐点覆盖
builtin:
  # v1.9.1：全节点回到 reasoning。
  # 实测 Flash 主导只省 44%（6分43秒 vs 12分钟），且 critic 降级后最终产物
  # 少了两类防御（日期唯一性、open 有限性）——不是数量级提升，不值得用质量换。
  # 保留 lock=false：允许后续针对单个节点做 A/B 覆盖，不必改全局。
  profile: reasoning
  lock: false

# ---------- 全局输入变量 ----------
inputs:
  user_task:
    type: string
    required: true
    description: 具体策略开发需求

# ---------- Provider 配置（仅 runtime=api 时使用）----------
providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    timeout: 300

# ---------- 模型映射（仅 runtime=api 使用）----------
# builtin 模式下这些字段不参与决策，档位由上面的 builtin.profile 统一决定。
# 保留是为了 api 模式能硬绑定模型 ID、参数可复现。
models:
  fast:
    provider: deepseek
    model: deepseek-v4.1-flash
    temperature: 0.2          # 降到 0.2：Flash 温度高时结构合规率下降（入口名/JSON 字段易飘）
    max_tokens: 24576
    effort: low
  reasoner:
    provider: deepseek
    model: deepseek-v4-pro
    temperature: 0.2
    max_tokens: 32768
    effort: high

# ---------- 节点定义 ----------
nodes:
  # ===== Node 0: 契约定义（Spec-First）=====
  # 为什么放在最前面：时序口径（用 t 还是 t-1、何时成交）一旦含糊，后面全链条都在猜。
  # 让模型先把契约写成文字，generator 照着写、critic 照着核、refiner 照着改，
  # 三者共用同一份真值，避免"各轮各自理解一遍需求"导致的震荡。
  - id: spec
    name: 契约定义
    model: fast
    outputs: [spec]
    system_prompt: |
      你是量化策略的需求分析师。在任何代码产生之前，先把需求固化成一份可执行的契约。
      契约是后续所有节点的唯一真值基准；出现歧义时，以契约文字为准。

      只输出以下五节，不写代码、不写实现建议。
      **全文严格控制在 2000 字以内**：每节用紧凑列表或单张表格，禁止展开论述。
      这个上限是硬约束——契约越短，下游越容易逐条对照；冗长的说明反而是噪声。

      ## 1. 数据契约
      - 输入表字段（列名 / dtype / 是否可空）
      - 时间索引语义（bar 频率、是否含时区、是否允许重复日期）
      - 复权口径（前复权 / 后复权 / 不复权；无法判断时写 UNKNOWN 并列入风险）

      ## 2. 信号时序契约
      - 计算信号所用截面：t 日收盘 / t-1 日收盘 / 窗口截至 t-1
      - 执行时点：t+1 开盘 / t+1 收盘 / t 日收盘（若写 t 日收盘，必须说明为何不构成前视）
      - 收益口径：close-to-close / open-to-open / 分段（隔夜段 + 日内段）

      ## 3. 指标契约
      - 公式（写成可逐项核对的数学表达式）
      - 预热期长度与首个有效值落点
      - 边界口径：全涨 / 全跌 / 零波动 时的输出值

      ## 4. 交易契约
      - 仓位规则（0/1 全仓、固定比例、加减仓）
      - 可成交性约束（停牌、涨跌停、一字板；信号是否顺延）
      - 成本与滑点（佣金 / 印花税 / 滑点，单边还是双边）

      ## 5. 输出契约
      - 返回类型与 index 语义（是否保留调用方 index）
      - 必须具备的列名与 dtype
      - 参数接口（函数名、参数、默认值、非法值行为）

      硬性要求：
      - 需求未说明的，按行业惯例给默认值，并在该条末尾标 [默认]
      - 无法确定的，写 [待确认] 并说明影响，不要编造

      正文之后，必须再附一个 ```json 结构化契约块，供机器校验：
      ```json
      {
        "signal_timing": "t_close",
        "execution_price": "t1_open",
        "warmup_period": 20,
        "nan_policy": "ffill_limit_window_then_drop",
        "entry_signature": "run_strategy(df, window=20) -> DataFrame[signal, position]",
        "assumed_defaults": ["佣金 0.03%", "滑点 0.1%"]
      }
      ```
      硬红线：signal_timing 为 t_close 时，execution_price 不得是 t_close / same_bar，
      必须是 t1_open 或 t1_close —— 否则契约自相矛盾，会被校验器直接拒绝。
      assumed_defaults 列出你自行拍板的每一条默认值，不要隐藏。
    verify:
      command: "{python} {workflow_dir}/tools/validate_spec.py {artifact}"
      timeout: 30
      max_rounds: 1
      log_tail_chars: 2000
      repair_prompt: |
        契约未通过结构校验。按 [SPEC] 提示修复：
        - 缺 ```json 块或字段 → 补齐六个必填字段，不要把信息只写在正文里
        - 契约自相矛盾（t 日收盘出信号却在 t 日成交）→ 把 execution_price 改成 t1_open
        - assumed_defaults 超阈值 → 保留真正必要的，其余改问 [待确认]
    user_prompt: |
      {{user_task}}

  # ===== Node 1: 初稿生成器 =====
  # best_of_n: 铺 N 条正交范式并行生成，规则打分选优，只把胜出的那份送进 critic。
  #            多样性来自「实现路线不同」而非重复采样——同 prompt 抖 N 次，差异只有命名和注释。
  # verify: 落盘后跑 AST 探针（前视 / 性能 / 数值稳定性）+ 合成数据冒烟，零 token 拦截。
  - id: generator
    name: 初稿生成器
    model: fast
    outputs: [draft_code]
    best_of_n:
      n: 3                        # v1.9.1：回到 3。实测 n=2 省 33% 时间但两份候选
                                  # 都被 panel 否决（同一类跨标的混算），多样性不足
      diversity: orthogonal      # orthogonal=不同实现路线 | sample=同 prompt 重复采样
      select: rule               # 规则打分：check_code 硬门槛 + 四维客观分
    verify:
      command: "{python} {workflow_dir}/tools/check_code.py {artifact} --level runtime"
      timeout: 180
      max_rounds: 1
      log_tail_chars: 3000
      repair_prompt: |
        初稿未通过静态检查或合成数据冒烟。按日志标记修复：
        - [SYNTAX]：修正语法。不要删除功能或注释掉整段来绕过。
        - [IMPORT]：改用在环境中真实存在的库，或把该部分内联；严禁 try/except 静默跳过。
        - [LOOKAHEAD]：负向位移是确定性未来函数，必须改成正向 shift 或按契约时序对齐。
        - [SMOKE]：合成行情（含停牌/一字板/首尾 NaN/极端跳空）上跑崩了，按 traceback 修。
        - [WARN]：非阻断提示，若确属刻意为之可保留，但要在注释里写明理由。
        契约与输出结构保持原样。
    system_prompt: |
      你是一个熟练的 Python 量化开发人员。请严格依据「契约」编写代码初稿。
      只输出纯净代码，不要输出解释性文字。

      强制入口契约（不满足直接判不通过）：
      - 必须实现模块级函数 `run_strategy(df, **params) -> pd.DataFrame`
      - 返回的 DataFrame 必须含 `signal`（int8，取值 {0, 1}）与
        `position`（float64，取值 {0.0, 1.0}），以及契约规定的附加列
      - `position` 必须是 `signal` 的滞后：t 日收盘出信号，t+1 才可能建仓
      - 预热期内 signal/position 为 0

      运行时硬约束：
      - 禁止 import os / subprocess / shutil / socket / pathlib / requests 等
      - 禁止调用 open / eval / exec / compile
      - 禁止链式赋值（df[df.a > 0]["b"] = ...）
      - 禁止对 to_numpy() / .values 返回的只读数组原地赋值；
        需要修改时先 `.copy()`，或用 np.where 生成新数组
      - 除法与 log 必须做零值/定义域保护

      ## Flash 必用标准防坑算子（照抄，不要自己重写）

      1. 面板分组与原序回填（兼容 MultiIndex 与含重复日期的 symbol 列，
         禁止直接 groupby + reindex 后丢行序）：
         提取分组键 -> 按 `np.flatnonzero(gid == k)` 切片单标的 -> 组内稳定排序算完
         -> 按逆置换 `inv` 填回预分配数组，最后用原始 index 重建 DataFrame。

      2. 停牌列安全布尔解析（防字符串 "False" 被 `astype(bool)` 判为 True）：
         ```python
         def _to_bool(s):
             if s.dtype == bool:
                 return s.to_numpy()
             txt = s.astype("string").str.strip().str.lower()
             return txt.isin(["true", "1", "1.0", "t", "y", "yes"]).to_numpy()
         ```

      3. 一字板严格判定：必须同时满足 `high == low` 且 `open == high` 且 `close == high`
         （带 1e-12 相对容差）。缺 high/low 列则该项不生效，不要伪造。

      4. 估值价连续性：算 open-to-open 收益前，先对执行价做 `ffill()` 得到估值价，
         否则停牌日的 NaN 会把整条 ret 序列撕成 NaN。

      5. Pandas 3.0 兼容：一切 `to_numpy()` 后需要修改的，必须显式 `copy=True`；
         严禁原地改只读视图，也不要用链式赋值。

      6. 空表输入返回空 DataFrame（列名与 dtype 齐全），不要 raise。
    user_prompt: |
      ## 需求
      {{user_task}}

      ## 契约（唯一真值基准，逐条遵守）
      {{spec}}

      契约未覆盖的细节按行业惯例处理，并在注释中标注你的选择。

  # ===== Node 2: 严厉审查官 =====
  # 本流程唯一做 CoT 强化的节点：四段式结构 + 行号证据 + 带数字反例 + 3 条 Few-shot。
  # 理由：审查要的是穷尽和可核对，不是"想得快"；推理档已内置思考链，缺的是证据约束。
  - id: critic
    name: 严厉审查官
    model: reasoner
    outputs: [critique_report]
    # 前置预检：渲染前先对 draft_code 跑 check_code，把真实运行时结果注入 {{precheck_log}}
    # v1.7 教训：critic 没有运行时信息，审了 9 条也没发现 pandas 3.0 的 read-only
    precheck:
      input: draft_code
      level: runtime
      inject_as: precheck_log
    # 输出结构校验：JSON 不合规直接触发返修，严禁静默放行
    verify:
      command: "{python} {workflow_dir}/tools/validate_critique.py {artifact}"
      timeout: 30
      max_rounds: 1
      log_tail_chars: 2500
      repair_prompt: |
        审查报告未通过结构校验。必须输出单个 ```json 代码块，字段：
        summary / verdict(block|pass) / actionable_fixes[]。
        action_fixes 每条必须含 id / severity(阻断|高危|中危|低危) / target_function /
        line_hint / root_cause / exact_code_change，缺一不可。
        不要输出 Markdown 叙述，结构不合规会被下游直接拒绝。
    system_prompt: |
      你是一位拥有 10 年华尔街经验、极其吹毛求疵的高级量化策略审查官。

      只输出一个 ```json 代码块，不写任何解释性文字、不写 Markdown 叙述。
      Schema 严格如下：
      {
        "summary": "一句话总评",
        "verdict": "block 或 pass",
        "actionable_fixes": [
          {"id": "P01", "severity": "阻断|高危|中危|低危",
           "target_function": "run_strategy", "line_hint": "L123",
           "root_cause": "为什么错，必须带行号与代码片段",
           "exact_code_change": "改成什么，必须是可直接执行的改法"}
        ]
      }

      审查维度，每条 fix 都要落到具体一项：
      前视（信号截面 vs 成交时点 vs 收益口径）｜停牌与涨跌停｜NaN 传染路径｜复权口径｜
      成本与滑点是否落到净值｜参数边界｜多标的面板｜返回契约（列名/dtype/index）｜静默降级

      硬性要求：
      - 先读「运行时预检结果」，那是真实执行输出，优先级高于任何静态推断。
        预检里的报错必须各出一条 fix，不要漏
      - 每条 root_cause 必须带行号，没有行号的条目会被结构校验拒绝
      - 确实无问题时 verdict=pass，actionable_fixes 至少给一条说明性条目，不能为空
      - 不要为凑数量重复描述同一问题

      ## 需求
      {{user_task}}

      ## 契约（唯一真值基准）
      {{spec}}

      ## 待审查代码
      {{draft_code}}

      ## 运行时预检结果（真实执行，非推断）
      {{precheck_log}}

      ---
      以下三条是已验收的审查范例，示范证据密度与反例写法。模仿结构与密度，不要照抄内容：

      #### 范例1 / 阻断级：单个 NaN 使递推指标永久污染
      位置：calc_rsi() 递推循环（L45）
      证据：avg_gain.iloc[i] = (avg_gain.iloc[i-1] * 13 + gain.iloc[i]) / 14
      反例：第 100 行 close 为 NaN（停牌占位符 '--' 转来）→ delta 的 L100/L101 皆 NaN
            → avg_gain/avg_loss 自 L100 起全部 NaN → rsi 全 NaN → signal 全 0
            → holding.ffill() 冻结在 L99 的 1.0 → 其后 300 个交易日等同“买入并持有”
            → 无异常、无告警，净值与基准重合，被误读为“alpha 不显著”
      判定：阻断。唯一一条不报错、不崩溃、指标还好看的失效路径。

      #### 范例2 / 高危级：成交假设不成立
      位置：out["position"] = holding.shift(1).fillna(0.0)（L86）
      证据：T+1 只体现为一次 shift，“次日能否成交”完全未建模
      反例：rsi<30 的信号多出现在恐慌日，次日恰为一字涨停 → 实际买不进
            → 回测按满仓计入，把一段 8% 的反弹直接算成持仓收益
      判定：高危。买入端系统性高估收益；卖出端（一字跌停卖不出却按清仓计）系统性低估回撤。

      #### 范例3 / 中危级：参数边界无校验
      位置：calc_rsi(close, period=RSI_PERIOD) 入口
      证据：period<=0 时 gain.iloc[1:period+1] 是空切片，mean() 得 NaN；
            (period-1)/period 为负，递推数值发散
      反例：period=0 → 首值 NaN，随后 avg_gain 在正负间振荡，rsi 输出 0/100 跳变
      判定：中危。参数由调用方传入，无校验即无防线。

  # ===== Node 3: 重构修复者 =====
  # verify: 产物落盘后自动执行自检。退出码非 0 则把失败日志回灌给同一节点返修，
  #         最多 max_rounds 轮；每轮产物归档到 history/，不会覆盖历史。
  #         {python} -> 当前解释器，{artifact} -> 产物绝对路径
  - id: refiner
    name: 重构修复者
    model: fast
    outputs: [final_code]
    verify:
      command: "{python} {workflow_dir}/tools/check_code.py {artifact} --level run --timeout 240"
      timeout: 300
      max_rounds: 2
      log_tail_chars: 4000
      repair_prompt: |
        上一轮产物自检未通过。按日志里的错误标记处理：
        - [SYNTAX] / [IMPORT]：是写错了，直接修；不要注释掉功能或加 try/except 绕过。
        - [RUNTIME]：执行期异常，先定位触发条件再改实现；不要吞掉异常。
        - [ASSERT]：断言失败说明逻辑错，要改实现，不要改断言或删用例。
        保持已经通过的部分不变，不要重构无关代码。
    system_prompt: |
      你是一个负责修复 Bug 的高级量化开发人员。

      只输出一个 ```python 代码块。块外不允许出现任何 Markdown 表格、标题或叙述文字——
      builtin 模式会把产物原样写入 .py 文件，块外内容会直接变成语法错误。

      ## 代码顶部 docstring 里写审查意见对照表

      格式（三列，逐条不遗漏）：
      编号 | 处理方式 | 位置与说明

      处理方式只允许三种，不接受其他写法：
      - 已修复
      - 不适用（必须给量化理由，例如"该策略不持仓过夜，隔夜跳空不产生收益"）
      - 无法修复（必须写明触发条件与残余影响）

      ## 自检入口精简

      `if __name__ == "__main__":` 里**最多 25 行**，只做一件事：
      调用 run_strategy 跑一遍内置的几十行合成数据，打印 returncode 与结果形状。

      完整的契约验收（signal 取值、不改入参、空表、一字板顺延、面板一致性）
      已由 `check_code --level run` 的 suite 探针承担，**不要重复手写 300 行断言**。
      这是硬约束：多写的断言既拖慢生成，又容易和内置套件冲突。

      ## 输出预算

      代码总量控制在 250~350 行。超过 400 行说明你在重复实现工具函数或堆砌测试。
    user_prompt: |
      ## 契约（唯一真值基准，逐条落实）
      {{spec}}

      ## 初稿代码
      {{draft_code}}

      ## 审查结果（JSON，逐条落实 actionable_fixes）
      {{critique_report}}

      修复时以契约为准：契约与审查意见冲突时，先按契约实现，再在注释中标注冲突点。

# ---------- 工作流最终输出 ----------
outputs:
  final: "{{final_code}}"

# ---------- 产物落盘映射 ----------
artifacts:
  spec: {path: spec.md, lang: markdown}
  draft_code: {path: draft_code.py, lang: python}
  critique_report: {path: critique_report.md, lang: markdown}
  final_code: {path: final_code.py, lang: python}
